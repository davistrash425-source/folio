# Runs on every push (any branch) and pull request: lint, type check, unit tests, a
# production build, then the smoke test against that build.
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # A real Postgres for the production build and smoke test. Unit tests use
    # PGlite instead (each test file gets its own), so they never share data.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: folio
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Throwaway values: CI never touches real accounts or sessions.
      SESSION_SECRET: ci-only-not-a-real-secret
      FOLIO_DATA_DIR: ci-data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      # A fresh checkout has no generated route types (PageProps etc.) yet.
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm test
      # Turbopack sometimes fails on the Google Fonts it downloads ("next/font/google
      # queries have exactly one entry", a Next.js bug), so try up to three times.
      - name: Build
        run: |
          for attempt in 1 2 3; do
            npm run build && exit 0
            echo "::warning::Build attempt $attempt failed"
            rm -rf .next
          done
          exit 1
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/folio
      - name: Smoke test the production build
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/folio
        run: |
          npm start -- --port 3000 > server.log 2>&1 &
          for i in $(seq 60); do curl -sf -o /dev/null http://localhost:3000/login && break; sleep 1; done
          npm run test:smoke
      - name: Browser test (sign-up to publishing)
        run: |
          npx playwright install --with-deps chromium
          # The same Turbopack font bug hits the dev server: try up to three times, each
          # with a fresh dev cache. A real failure fails all three.
          for attempt in 1 2 3; do
            npm run test:e2e && exit 0
            echo "::warning::Browser test attempt $attempt failed"
            rm -rf .next/dev
          done
          exit 1
      - name: Show server log if something failed
        if: failure()
        run: cat server.log || true
